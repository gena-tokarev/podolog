name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/gena-tokarev/podolog-web

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

  build-image:
    name: Build web image
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=production,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.title=Podolog Web
            org.opencontainers.image.description=Podolog Warsaw website

      - name: Build and optionally publish image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=podolog-web
          cache-to: type=gha,mode=max,scope=podolog-web
          provenance: mode=max
          sbom: true

      - name: Attest published image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  promote-production:
    name: Promote production release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://podolog-warsaw.pl
    concurrency:
      group: podolog-production-promotion
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Check out current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1

      - name: Decide whether to promote
        id: decision
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -eu
          current_sha=$(git rev-parse HEAD)
          if [ "$current_sha" = "$RELEASE_SHA" ]; then
            echo "promote=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping stale release $RELEASE_SHA; main is $current_sha."
            echo "promote=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create infra repository token
        if: steps.decision.outputs.promote == 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.INFRA_APP_CLIENT_ID }}
          private-key: ${{ secrets.INFRA_APP_PRIVATE_KEY }}
          owner: gena-tokarev
          repositories: infra
          permission-contents: write

      - name: Check out infra repository
        if: steps.decision.outputs.promote == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gena-tokarev/infra
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          path: infra
          persist-credentials: true

      - name: Commit immutable release to infra
        if: steps.decision.outputs.promote == 'true'
        env:
          IMAGE_DIGEST: ${{ needs.build-image.outputs.digest }}
          RELEASE_SHA: ${{ github.sha }}
        working-directory: infra
        run: |
          set -eu
          printf '%s\n' "$IMAGE_DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'

          install -d environments/development/podolog
          {
            echo "sourceSha: \"$RELEASE_SHA\""
            echo "web:"
            echo "  image:"
            echo "    repository: ghcr.io/gena-tokarev/podolog-web"
            echo "    digest: \"$IMAGE_DIGEST\""
          } > environments/development/podolog/release.yaml

          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "41898282+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          git add environments/development/podolog/release.yaml
          if git diff --cached --quiet; then
            echo "Infra already contains this release."
            exit 0
          fi
          git commit -m "deploy(podolog): $RELEASE_SHA"

          attempts=0
          until git push origin HEAD:main; do
            attempts=$((attempts + 1))
            if [ "$attempts" -ge 5 ]; then
              echo "Unable to promote after $attempts attempts." >&2
              exit 1
            fi
            git fetch origin main
            git rebase origin/main
          done
