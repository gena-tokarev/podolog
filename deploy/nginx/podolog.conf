upstream podolog_nextjs {
    server web:3000;
    keepalive 32;
}

map $http_x_forwarded_proto $upstream_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

map $http_x_forwarded_port $upstream_forwarded_port {
    default $http_x_forwarded_port;
    "" $server_port;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    server_tokens off;

    client_max_body_size 10m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    location / {
        proxy_pass http://podolog_nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $upstream_forwarded_port;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;

        proxy_buffering off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
